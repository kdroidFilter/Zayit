name: Build and Release Compose Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # The official builds include the smart siddur and the semantic search (open core): their private Maven packages
    # are readable only with the access of their own repositories, so a classic token with read:packages (GITHUB_TOKEN
    # cannot reach them); the semantic search uses the siddur's token too
    env:
      SEFORIM_SIDDUR_TOKEN: ${{ secrets.SEFORIM_SIDDUR_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 (DEB) - GraalVM
          - os: ubuntu-latest
            arch: amd64
            pkg: deb
            graalvm: true

          # Linux ARM64 (DEB) - GraalVM
          - os: ubuntu-24.04-arm
            arch: arm64
            pkg: deb
            graalvm: true

          # Linux x64 (RPM) - GraalVM
          - os: ubuntu-latest
            arch: amd64
            pkg: rpm
            graalvm: true

          # Linux ARM64 (RPM) - GraalVM
          - os: ubuntu-24.04-arm
            arch: arm64
            pkg: rpm
            graalvm: true

          # Linux x64 (Pacman) - GraalVM
          - os: ubuntu-latest
            arch: amd64
            pkg: pacman
            graalvm: true

          # Linux ARM64 (Pacman) - GraalVM
          - os: ubuntu-24.04-arm
            arch: arm64
            pkg: pacman
            graalvm: true

          # Windows x64 - GraalVM
          - os: windows-latest
            arch: amd64
            rust_target: x86_64-pc-windows-msvc
            graalvm: true

          # Windows ARM64 - JVM (no native-image toolchain)
          - os: windows-11-arm
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            graalvm: false

          # macOS Apple Silicon (ARM64) - GraalVM
          - os: macos-26
            jdk_arch: aarch64
            graalvm: true

          # macOS Intel (x64) - GraalVM
          - os: macos-26-intel
            jdk_arch: x64
            graalvm: true

    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Normalize version for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag=$(git describe --tags --abbrev=0)
          echo "Using latest tag for version: $tag"
          echo "GITHUB_REF=refs/tags/$tag" >> "$GITHUB_ENV"

      - name: Compute version and asset name
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          case "${{ matrix.os }}" in
            ubuntu*)  plat=linux ;;
            windows*) plat=windows ;;
            macos*)   plat=macos ;;
            *)        plat=unknown ;;
          esac
          # deb and rpm share the same arch on the same runner — keep the pkg suffix so artifact names stay unique.
          pkg_suffix=""
          if [ -n "${{ matrix.pkg }}" ]; then pkg_suffix="-${{ matrix.pkg }}"; fi
          # generate-update-yml infers the platform from the artifact dir name (must contain linux/macos/windows).
          echo "ASSET_NAME=release-assets-${plat}-${{ matrix.arch || matrix.jdk_arch }}${pkg_suffix}" >> "$GITHUB_ENV"

      - name: Setup Nucleus
        uses: kdroidFilter/Nucleus/.github/actions/setup-nucleus@712f1e520c73fd68e1e7514b17700e577643802c
        # The Nucleus plugin provisions the GraalVM toolchain itself (Oracle GraalVM per the
        # graalvm { toolchain { } } DSL, Liberica NIK on Intel macs); this only sets up
        # Xcode/MSVC and caches the toolchain.
        with:
          graalvm: ${{ matrix.graalvm }}
          graalvm-distribution: oracle

      # GPG-signs the .deb/.rpm and enables Nucleus' passwordless self-update: the package ships a
      # root-owned update helper + polkit policy that installs an update only if its detached
      # <pkg>.asc verifies against the public key bundled in the app.
      - name: Setup Linux signing
        if: startsWith(matrix.os, 'ubuntu') && (matrix.pkg == 'deb' || matrix.pkg == 'rpm')
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "::warning::No LINUX_GPG_PRIVATE_KEY secret; Linux packages stay unsigned (password-prompted updates)."
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/zayit-signing-key.asc"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" > "$KEY_FILE"
          {
            echo ""
            echo "compose.desktop.linux.sign=true"
            echo "compose.desktop.linux.signing.keyId=$LINUX_GPG_KEY_ID"
            echo "compose.desktop.linux.signing.keyFile=$KEY_FILE"
            echo "compose.desktop.linux.signing.passphrase=$LINUX_GPG_PASSPHRASE"
            echo "compose.desktop.linux.signing.silentUpdate=true"
          } >> gradle.properties
          echo "LINUX_SIGNED=true" >> "$GITHUB_ENV"

      # Linux builds
      - name: Build & stage Linux .deb
        if: startsWith(matrix.os, 'ubuntu') && matrix.pkg == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :SeforimApp:packageGraalvmDeb
          mkdir -p staging
          src="$(find SeforimApp/build/compose/binaries/main/graalvm-deb -name '*.deb' | head -n1)"
          [ -n "$src" ] || { echo "::error::No .deb produced"; exit 1; }
          # Name kept in sync with website/public/download/launch.linux deb pattern.
          cp "$src" "staging/zayit_${VERSION}_${{ matrix.arch }}.deb"
          # Detached signature, fetched by the updater next to the package for the passwordless install.
          if [ "${LINUX_SIGNED:-}" = "true" ]; then
            [ -f "$src.asc" ] || { echo "::error::No detached signature for $src"; exit 1; }
            cp "$src.asc" "staging/zayit_${VERSION}_${{ matrix.arch }}.deb.asc"
          fi

      # The app folder as a .tar.gz, once per architecture (beside the .deb), for the Flathub manifest to repackage
      - name: Build & stage Linux .tar.gz (Flathub)
        if: startsWith(matrix.os, 'ubuntu') && matrix.pkg == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :SeforimApp:packageGraalvmTar
          src="$(find SeforimApp/build/compose/binaries/main/graalvm-tar.gz -name '*.tar.gz' | head -n1)"
          [ -n "$src" ] || { echo "::error::No .tar.gz produced"; exit 1; }
          case "${{ matrix.arch }}" in
            amd64) tar_arch=x86_64 ;;
            arm64) tar_arch=aarch64 ;;
            *)     tar_arch="${{ matrix.arch }}" ;;
          esac
          cp "$src" "staging/zayit-${VERSION}-linux-${tar_arch}.tar.gz"

      - name: Build & stage Linux .rpm
        if: startsWith(matrix.os, 'ubuntu') && matrix.pkg == 'rpm'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :SeforimApp:packageGraalvmRpm
          mkdir -p staging
          src="$(find SeforimApp/build/compose/binaries/main/graalvm-rpm -name '*.rpm' | head -n1)"
          [ -n "$src" ] || { echo "::error::No .rpm produced"; exit 1; }
          case "${{ matrix.arch }}" in
            amd64) rpm_arch=x86_64 ;;
            arm64) rpm_arch=aarch64 ;;
            *)     rpm_arch="${{ matrix.arch }}" ;;
          esac
          # Name kept in sync with website/public/download/launch.linux rpm pattern.
          cp "$src" "staging/zayit-${VERSION}-1.${rpm_arch}.rpm"
          if [ "${LINUX_SIGNED:-}" = "true" ]; then
            [ -f "$src.asc" ] || { echo "::error::No detached signature for $src"; exit 1; }
            cp "$src.asc" "staging/zayit-${VERSION}-1.${rpm_arch}.rpm.asc"
          fi

      - name: Build & stage Linux .pacman
        if: startsWith(matrix.os, 'ubuntu') && matrix.pkg == 'pacman'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :SeforimApp:packageGraalvmPacman
          mkdir -p staging
          # Nucleus emits the Arch package with a .pacman extension.
          src="$(find SeforimApp/build/compose/binaries/main/graalvm-pacman -name '*.pacman' | head -n1)"
          [ -n "$src" ] || { echo "::error::No pacman package produced"; exit 1; }
          case "${{ matrix.arch }}" in
            amd64) pac_arch=x86_64 ;;
            arm64) pac_arch=aarch64 ;;
            *)     pac_arch="${{ matrix.arch }}" ;;
          esac
          cp "$src" "staging/zayit-${VERSION}-1-${pac_arch}.pacman"

      # Windows GraalVM build (x64)
      - name: Build Windows NSIS installer (GraalVM)
        if: startsWith(matrix.os, 'windows') && matrix.graalvm
        shell: pwsh
        run: .\gradlew.bat :SeforimApp:packageGraalvmNsis

      # Microsoft Store package (x64 only for now), unsigned: the Store signs it. Kept out of the GitHub release
      # (an unsigned MSIX cannot be installed from there), submitted below
      - name: Build Microsoft Store package (GraalVM)
        if: startsWith(matrix.os, 'windows') && matrix.graalvm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat :SeforimApp:packageGraalvmAppX
          $appx = Get-ChildItem "SeforimApp\build\compose\binaries\main\graalvm-appx\zayit-$env:VERSION-win-x64.appx"
          New-Item -ItemType Directory -Force msstore | Out-Null
          # msstore publish only takes .msix / .msixupload; .appx and .msix are the same format
          Copy-Item $appx.FullName "msstore\Zayit-$env:VERSION-x64.msix"

      - name: Upload Microsoft Store package
        if: startsWith(matrix.os, 'windows') && matrix.graalvm
        uses: actions/upload-artifact@v6
        with:
          name: msstore-x64
          path: msstore/*.msix
          if-no-files-found: error

      # Submitted to Partner Center for certification (Store ID 9NC26MP2QMPS) as soon as it is built, without waiting
      # for the other platforms: the package replaced, the listing kept. Tag pushes only (a manual run reuses the last
      # tag's version, which the Store already has); a new submission replaces one still in certification. A Store
      # failure leaves a warning and never holds back the GitHub release. Needs the PARTNER_CENTER_* secrets of an
      # Entra app with the Manager role in Partner Center
      - name: Setup Microsoft Store Developer CLI
        if: startsWith(matrix.os, 'windows') && matrix.graalvm && github.event_name == 'push'
        uses: microsoft/setup-msstore-cli@v1

      - name: Submit to the Microsoft Store
        if: startsWith(matrix.os, 'windows') && matrix.graalvm && github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msix = Get-ChildItem msstore\*.msix | Select-Object -First 1
          msstore publish $msix.FullName --appId 9NC26MP2QMPS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      # Windows JVM build (ARM64)
      - name: Build Windows NSIS installer (JVM)
        if: startsWith(matrix.os, 'windows') && !matrix.graalvm
        shell: pwsh
        run: .\gradlew.bat :SeforimApp:createReleaseDistributable :SeforimApp:packageReleaseNsis

      - name: Install Rust toolchain
        if: startsWith(matrix.os, 'windows')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build Rust wrapper and stage Windows assets
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wtok = if ('${{ matrix.arch }}' -eq 'amd64') { 'x64' } else { 'arm64' }
          $ver = $env:VERSION

          $nsis = Get-ChildItem `
            "SeforimApp\build\compose\binaries\main\graalvm-nsis\zayit-*-nsis.exe", `
            "SeforimApp\build\compose\binaries\main-release\nsis\zayit-*-nsis.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { Write-Error "NSIS installer not found"; exit 1 }

          New-Item -ItemType Directory -Force staging | Out-Null

          # Raw NSIS (silent oneClick) — consumed by the auto-updater only.
          Copy-Item $nsis.FullName "staging\Zayit-$ver-windows-$wtok-nsis.exe"

          # Rust wrapper installer (splash UI) embeds and runs the NSIS silently — this is the user-facing download.
          Push-Location installer
          New-Item -ItemType Directory -Force resources | Out-Null
          Copy-Item "..\SeforimApp\src\jvmMain\assets\common\splash.png" "resources\splash.png"
          Copy-Item $nsis.FullName "resources\zayit-nsis.exe"
          cargo build --release --target ${{ matrix.rust_target }}
          Pop-Location
          Copy-Item "installer\target\${{ matrix.rust_target }}\release\zayit-installer.exe" "staging\Zayit-$ver-windows-$wtok.exe"

      # macOS builds (GraalVM): .dmg (download) + .zip (auto-update)
      - name: Build & stage macOS .dmg + .zip
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          # .dmg = manual download, .zip (+ .blockmap) = auto-update feed. Both are
          # built by Gradle and shipped under electron-builder's own versioned names
          # (no renaming): latest-mac.yml is regenerated from them downstream, and
          # launch.mac / the website resolve the assets via the GitHub API, so no
          # fixed filename is needed. The .blockmap powers differential auto-updates.
          ./gradlew :SeforimApp:packageGraalvmDmg :SeforimApp:packageGraalvmZip
          mkdir -p staging

          SEARCH_ROOT="SeforimApp/build/compose/binaries/main"
          find "$SEARCH_ROOT/graalvm-dmg" -name '*.dmg' -exec cp {} staging/ \;
          find "$SEARCH_ROOT/graalvm-zip" \( -name '*.zip' -o -name '*.zip.blockmap' \) -exec cp {} staging/ \;

          ls staging/*.dmg >/dev/null 2>&1 || { echo "::error::No .dmg produced"; exit 1; }
          ls staging/*.zip >/dev/null 2>&1 || { echo "::error::No .zip produced"; exit 1; }

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ASSET_NAME }}
          path: staging/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout (for tag/notes context)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine tag and version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download all release assets
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: release-assets-*

      - name: List downloaded files
        run: ls -R artifacts

      # Recomputes sha512/size from the actual files and merges per-platform feeds
      # (latest.yml / latest-mac.yml / latest-linux.yml) — handles multi-arch and the
      # Rust-wrapped exe / manual macOS zip correctly since it hashes the final assets.
      - name: Generate auto-update feeds (latest*.yml)
        uses: kdroidFilter/Nucleus/.github/actions/generate-update-yml@712f1e520c73fd68e1e7514b17700e577643802c
        with:
          artifacts-path: artifacts
          version: ${{ env.VERSION }}
          channel: latest

      # Creates/updates the published GitHub release and uploads every installer + the consolidated feeds;
      # auto-update clients see it immediately.
      - name: Create release and upload installers + feeds
        uses: kdroidFilter/Nucleus/.github/actions/publish-release@712f1e520c73fd68e1e7514b17700e577643802c
        with:
          artifacts-path: artifacts
          tag: ${{ env.TAG }}
          release-type: release
